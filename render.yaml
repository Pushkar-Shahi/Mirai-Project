# Render hosts the shared Mirai API, its PostgreSQL database, and the role portals.
services:
  - type: web
    name: club-tracker-demo-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: bash scripts/start_public_demo.sh
    healthCheckPath: /health
    envVars:
      - key: APP_MODE
        value: local
      - key: SEED_DEMO
        value: "1"
      - key: APP_NAME
        value: Mirai Club Activities Tracker
      - key: INSTITUTION_NAME
        value: Mirai
      - key: DATABASE_URL
        fromDatabase:
          name: club-tracker-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      # Comma-separated browser origins allowed to call the API ("*" for demo/all)
      - key: CORS_ORIGINS
        value: "*"
      - key: PUBLIC_BASE_URL
        fromService:
          name: club-tracker-demo-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: club-tracker-portals
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist-portals
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: MIRAI_API_BASE_URL
        fromService:
          name: club-tracker-demo-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MIRAI_DEMO_ACCOUNTS
        value: "1"

databases:
  - name: club-tracker-demo-db
    plan: free
    region: singapore
    databaseName: clubtracker
    user: club
    postgresMajorVersion: "16"
