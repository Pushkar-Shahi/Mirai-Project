name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club
          POSTGRES_DB: clubtracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U club" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://club:club@localhost:5432/clubtracker
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      # WeasyPrint (certificate PDFs) loads Pango at import time; the e2e PDF download needs it.
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r backend/requirements.txt pytest
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Backend + node + Jest + Karma
        run: npm run test:all
      - name: Playwright e2e against a migrated demo API
        run: |
          (cd backend && python -m app.migrate && python -m scripts.seed)
          (cd backend && APP_MODE=local REDIS_URL= UPLOAD_DIR=/tmp/uploads AUTO_MIGRATE=0 python -m uvicorn app.main:app --port 8000 &)
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          cd frontend && MIRAI_E2E_API=http://127.0.0.1:8000 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: frontend/coverage
